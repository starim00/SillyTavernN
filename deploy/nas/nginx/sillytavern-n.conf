server {
    listen 4174 ssl;
    server_name philia093.world;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/philia093.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philia093.world/privkey.pem;
    include /etc/nginx/conf.d/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/conf.d/ssl-dhparams.pem;

    client_max_body_size 100m;
    access_log /var/log/nginx/sillytavern-n-access.log;
    error_log /var/log/nginx/sillytavern-n-error.log;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

